# Hlídač letenek – běží na serverech GitHubu.
name: Hlídač letenek

# Spouštění: každou hodinu ho přes GitHub API spustí služba cron-job.org
# (stejně jako tlačítko "Run workflow"). Vlastní plánování GitHubu (schedule)
# záměrně nepoužíváme – u tohoto repozitáře běhy nespouštělo vůbec.
on:
  workflow_dispatch:

permissions:
  contents: write # aby mohl běh uložit ceny.json zpět do repozitáře

concurrency:
  group: hlidac # nikdy dva běhy najednou (přepisovaly by si ceny.json)
  cancel-in-progress: false

# Google občas zablokuje IP adresu serveru GitHubu. Každý pokus (job) dostane
# nový server s jinou IP, proto to při blokaci zkusíme až 3×. Teprve když
# selže i třetí pokus, hlídač pošle ⚠️ "nefunguje".
jobs:
  pokus1:
    uses: ./.github/workflows/pokus.yml
    with:
      final_attempt: "0"
    secrets: inherit

  pokus2:
    needs: pokus1
    if: needs.pokus1.outputs.blocked == 'true'
    uses: ./.github/workflows/pokus.yml
    with:
      final_attempt: "0"
    secrets: inherit

  pokus3:
    needs: pokus2
    if: needs.pokus2.outputs.blocked == 'true'
    uses: ./.github/workflows/pokus.yml
    with:
      final_attempt: "1"
    secrets: inherit
